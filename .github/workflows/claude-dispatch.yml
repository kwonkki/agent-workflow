name: Claude Dispatch (Implement)

# PR/이슈 코멘트에 "@claude ..." 가 포함되면 에이전트가 요청대로 코드를 수정하고
# PR 브랜치에 새 커밋을 푸시한다.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  dispatch:
    # @claude 멘션이 있는 코멘트에만 반응
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 커밋/푸시
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-opus-4-8
          # 멘션 본문(요청)을 그대로 에이전트에게 전달한다.
          prompt: ${{ github.event.comment.body }}
          claude_args: |
            --allowed-tools "Edit,Write,Read,Bash(pytest:*),Bash(ruff:*),Bash(git:*),Bash(gh pr:*)"
