name: Claude Code Review (Review)

# PR이 열리거나 갱신될 때 변경 diff를 에이전트가 자동 리뷰하고 인라인 코멘트를 남긴다.
on:
  pull_request:
    types: [opened, synchronize]

# 동시에 여러 push가 들어오면 이전 리뷰 실행을 취소한다.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # 리뷰 코멘트 작성
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # diff 계산을 위해 전체 히스토리

      - name: Claude PR review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-opus-4-8
          # 에이전트에게 줄 작업 지시. CLAUDE.md 의 리뷰 규칙을 함께 따른다.
          prompt: |
            이 PR의 변경 diff를 리뷰하라.
            - 정확성 버그(경계 조건, 0 나누기, 빈 입력, 잘못된 타입)를 최우선으로 본다.
            - 발견한 문제는 해당 파일/라인에 인라인 리뷰 코멘트로 남긴다.
            - 사소한 스타일 지적은 생략한다.
            - 문제가 없으면 "LGTM — 변경 사항 양호"라고 짧게 요약 코멘트를 남긴다.
          # 리뷰만 하도록 도구를 코멘트 작성 범위로 제한
          claude_args: |
            --allowed-tools "Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr review:*)"
